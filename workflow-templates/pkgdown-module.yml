# Giotto Suite module pkgdown sites -- the caller for the `website` branch.
#
#   release  https://giotto-suite.github.io/<pkg>/      the default branch
#   dev      https://giotto-suite.github.io/<pkg>/dev/  the dev branch
#
# The default branch is production: a merge to it is a release and bumps the
# version, so its head is the released version. Tags archive releases;
# nothing here depends on them.
#
# SETUP
# 1. Make the `website` branch site content only: _pkgdown.yml, pkgdown/ and
#    this file. The package source is checked out at build time, so the branch
#    never has to be kept in sync with the package.
# 2. Copy pkgdown/pre-build.sh (restores the documented ref's vignettes) and
#    pkgdown/dev-banner.html (edit the package name and links) from
#    giotto-suite/GiottoUtils@website. pre-build.sh must be committed
#    executable (git update-index --chmod=+x).
# 3. If the dev line is not `dev` (e.g. `gsource`), change the dev-ref default
#    and the `|| 'dev'` fallback below.
# 4. Add extra-packages a vignette needs, and `pins` / `expect-versions` if the
#    dev line needs unreleased dependencies (see the shared workflow's inputs).
# 5. Add the "pkgdown dev trigger" template to the dev branch.
#
# WHEN DOES EACH SITE REBUILD?
#   push / PR here      both sites (a PR builds without deploying)
#   dev changes         dev site, dispatched by pkgdown-dev-trigger.yaml on dev
#   a new release       within a day: giotto-suite/.github's "rebuild release
#                       sites" job dispatches a release-only build when the
#                       default branch has moved (main carries no CI, so it
#                       cannot trigger this itself). Run by hand to go sooner.
#
# The build itself is giotto-suite/.github/.github/workflows/pkgdown-site.yaml.
# A release site is a link target other packages resolve to, so its reference
# pages must keep their URLs.

name: pkgdown

on:
  push:
    branches: [website]
  pull_request:
    branches: [website]
  workflow_dispatch:
    inputs:
      site:
        description: "Which site to build"
        type: choice
        options: [both, release, dev]
        default: both
      release-ref:
        description: "Ref for the release site (default: the default branch)"
        required: false
      dev-ref:
        description: "Branch for the dev site"
        required: false
        default: dev

jobs:
  release-ref:
    if: inputs.site != 'dev'
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.release-ref }}
        run: |
          ref="${INPUT_REF:-$(gh api "repos/$GITHUB_REPOSITORY" -q .default_branch)}"
          echo "release site documents $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  release:
    needs: release-ref
    # The reusable workflow can only narrow what the caller grants, so the
    # write permission the gh-pages deploy needs has to be declared here.
    permissions:
      contents: write
    uses: giotto-suite/.github/.github/workflows/pkgdown-site.yaml@main
    with:
      mode: release
      package-repo: ${{ github.repository }}
      package-ref: ${{ needs.release-ref.outputs.ref }}
      overlay-files: "_pkgdown.yml"
      dependencies: '"hard"'
      extra-packages: "any::pkgdown, bioc::BiocStyle, local::."

  dev:
    # the shared workflow's concurrency group serialises this with the release
    # deploy, since both write the same gh-pages branch
    if: inputs.site != 'release'
    permissions:
      contents: write
    uses: giotto-suite/.github/.github/workflows/pkgdown-site.yaml@main
    with:
      mode: dev
      package-repo: ${{ github.repository }}
      package-ref: ${{ inputs.dev-ref || 'dev' }}
      overlay-files: "_pkgdown.yml"
      dependencies: '"hard"'
      extra-packages: "any::pkgdown, bioc::BiocStyle, local::."
