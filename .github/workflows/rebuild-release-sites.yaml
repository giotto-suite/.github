# Rebuilds module release sites after a release.
#
# A release site documents its module's default branch, and main carries no
# CI, so a release cannot trigger its own rebuild. Once a day this checks every
# module on the pkgdown-module template and dispatches a release-only build
# where the default branch has moved since the last one. Logic and the meaning
# of "last release build": .github/scripts/rebuild-release-sites.sh.
#
# Needs the org secret SITE_DISPATCH_TOKEN: a fine-grained token on the
# giotto-suite repositories with Actions: read and write, Contents: read.
# GITHUB_TOKEN cannot dispatch workflows in other repositories.

name: rebuild release sites

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Only report which sites would rebuild"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch stale release sites
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          ORG: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::SITE_DISPATCH_TOKEN is not set; see this workflow's header"
            exit 1
          fi
          .github/scripts/rebuild-release-sites.sh
